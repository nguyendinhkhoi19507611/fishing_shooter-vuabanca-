<!DOCTYPE html>
<html lang="vi">
<head>

    <title>Vua Bắn Cá - Fishing Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        </div>
    </div>

    <script src="game.js"></script>

</html>
